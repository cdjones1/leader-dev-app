<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #1a1a2e; color: #eee; margin: 0; padding: 32px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    h1 { font-size: 20px; margin: 0; }
    a { color: #93c5fd; text-decoration: none; }
    .card { background: #16213e; padding: 24px; border-radius: 8px; max-width: 700px; }
    .content-box { color: #d1d5db; line-height: 1.6; white-space: pre-wrap; margin: 16px 0; }
    button {
      padding: 10px 18px; background: #4f46e5; color: white;
      border: none; border-radius: 6px; cursor: pointer; font-size: 14px;
    }
    button:hover { background: #4338ca; }
    button:disabled { background: #374151; cursor: not-allowed; }
    textarea {
      width: 100%; padding: 10px; margin-top: 8px; border-radius: 6px;
      border: 1px solid #333; background: #0f172a; color: #eee; box-sizing: border-box;
      font-family: inherit;
    }
    .answer-box {
      background: #0f172a; padding: 16px; border-radius: 6px; margin-top: 12px;
      white-space: pre-wrap;
    }
    .your-answer { border-left: 3px solid #4f46e5; }
    .correct-answer { border-left: 3px solid #16a34a; margin-top: 16px; }
    .label { font-size: 12px; text-transform: uppercase; color: #888; margin-bottom: 6px; }
    .locked-note { color: #888; font-size: 13px; margin-top: 8px; }
    #message { color: #f87171; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <h1 id="pageTitle">Loading...</h1>
    <a id="backLink" href="/dashboard.html">&larr; Back to Plan</a>
  </div>

  <div class="card" id="taskCard"></div>
  <div id="message"></div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/index.html';

    const params = new URLSearchParams(window.location.search);
    const taskId = params.get('id');
    const planId = params.get('planId'); // used only for the back link

    if (planId) {
      document.getElementById('backLink').href = '/plan.html?id=' + planId;
    }

    async function apiCall(url, options = {}) {
      const res = await fetch(url, {
        ...options,
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token, ...(options.headers || {}) },
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    }

    let currentPlan = null;

    function isMyTask(task) {
      const user = JSON.parse(localStorage.getItem('user'));
      if (user.isAdmin) return true;
      if (!currentPlan) return true; // can't determine - fail open to viewing, server still enforces the real rule
      const myId = user.id;
      if (task.assignedTo === 'DEVELOPER') return currentPlan.pairing.developer.id === myId;
      return currentPlan.pairing.developee.id === myId; // default DEVELOPEE
    }

    function notYoursNotice(task) {
      const role = (task.assignedTo || 'DEVELOPEE').toLowerCase();
      return `<p style="color:#f59e0b; margin-top:12px;">This task is assigned to the ${role} on this plan - you can view it, but only they (or an admin) can complete it.</p>`;
    }

    function readingTaskHtml(task) {
      const mine = isMyTask(task);
      return `
        <div class="content-box">${task.content || '(No content written for this task yet.)'}</div>
        ${mine
          ? `<button ${task.completed ? 'disabled' : ''} onclick="markComplete('${task.id}')">${task.completed ? 'Completed' : 'Mark as Read / Complete'}</button>`
          : (task.completed ? '<p style="color:#86efac;">Completed</p>' : notYoursNotice(task))}
      `;
    }

    function questionTaskHtml(task) {
      const contentHtml = `<div class="content-box">${task.content || ''}</div>`;
      const mine = isMyTask(task);

      if (!task.submittedAt) {
        if (!mine) {
          return `${contentHtml}${notYoursNotice(task)}`;
        }
        return `
          ${contentHtml}
          <label>Your Answer</label>
          <textarea id="answerBox" rows="5"></textarea>
          <div class="locked-note">Once you submit, this answer is locked and cannot be changed.</div>
          <button style="margin-top:10px;" onclick="submitAnswer('${task.id}')">Submit Answer</button>
        `;
      }

      // Already submitted - show their locked answer and the correct answer below it.
      return `
        ${contentHtml}
        <div class="answer-box your-answer">
          <div class="label">Submitted Answer</div>
          ${task.submittedAnswer}
        </div>
        <div class="answer-box correct-answer">
          <div class="label">Correct Answer</div>
          ${task.correctAnswer}
        </div>
      `;
    }

    function checklistTaskHtml(task) {
      const mine = isMyTask(task);
      const contentHtml = task.content ? `<div class="content-box">${task.content}</div>` : '';
      const itemsHtml = task.checklistItems.map((item) => `
        <label style="display:flex; align-items:center; gap:8px; padding:6px 0; ${item.completed ? 'color:#6b7280; text-decoration:line-through;' : ''}">
          <input type="checkbox" ${item.completed ? 'checked' : ''} ${mine ? '' : 'disabled'} onchange="toggleChecklistItem('${item.id}')">
          ${item.text}
        </label>
      `).join('');
      return `
        ${contentHtml}
        <div>${itemsHtml}</div>
        ${task.completed ? '<p style="color:#86efac; margin-top:12px;">All items checked - task complete.</p>' : (mine ? '' : notYoursNotice(task))}
      `;
    }

    function multipleChoiceTaskHtml(task) {
      const contentHtml = task.content ? `<div class="content-box">${task.content}</div>` : '';
      const mine = isMyTask(task);

      if (!task.selectedOptionId) {
        if (!mine) {
          const optionsHtml = task.choiceOptions.map((opt) => `<div style="padding:6px 0;">${opt.text}</div>`).join('');
          return `${contentHtml}<div>${optionsHtml}</div>${notYoursNotice(task)}`;
        }
        const optionsHtml = task.choiceOptions.map((opt) => `
          <label style="display:flex; align-items:center; gap:8px; padding:6px 0;">
            <input type="radio" name="mcOption" value="${opt.id}">
            ${opt.text}
          </label>
        `).join('');
        return `
          ${contentHtml}
          <div>${optionsHtml}</div>
          <div class="locked-note">Once you submit, your choice is locked and cannot be changed.</div>
          <button style="margin-top:10px;" onclick="submitChoice('${task.id}')">Submit Answer</button>
        `;
      }

      // Already answered - show every option, marking their pick and the correct one.
      const resultHtml = task.choiceOptions.map((opt) => {
        const isMine = opt.id === task.selectedOptionId;
        const style = opt.isCorrect
          ? 'color:#86efac; font-weight:600;'
          : (isMine ? 'color:#f87171;' : 'color:#9ca3af;');
        return `<div style="padding:6px 0; ${style}">${isMine ? '→ ' : '　 '}${opt.text}${opt.isCorrect ? ' (correct)' : ''}${isMine && !opt.isCorrect ? ' (their answer)' : ''}</div>`;
      }).join('');

      return `
        ${contentHtml}
        <div>${resultHtml}</div>
        <p style="margin-top:12px; font-weight:600; color:${task.isCorrect ? '#86efac' : '#f87171'};">
          ${task.isCorrect ? 'Correct!' : 'Incorrect.'}
        </p>
      `;
    }

    async function loadTask() {
      try {
        const task = await apiCall('/modules/tasks/' + taskId);
        if (planId) {
          try {
            currentPlan = await apiCall('/plans/' + planId);
          } catch (e) {
            currentPlan = null; // fine - isMyTask() falls back to fail-open on viewing, server still enforces the real rule
          }
        }
        document.getElementById('pageTitle').textContent = task.text;
        const card = document.getElementById('taskCard');
        if (task.taskType === 'QUESTION') {
          card.innerHTML = questionTaskHtml(task);
        } else if (task.taskType === 'CHECKLIST') {
          card.innerHTML = checklistTaskHtml(task);
        } else if (task.taskType === 'MULTIPLE_CHOICE') {
          card.innerHTML = multipleChoiceTaskHtml(task);
        } else {
          card.innerHTML = readingTaskHtml(task);
        }
      } catch (err) {
        document.getElementById('message').textContent = err.message;
      }
    }

    async function toggleChecklistItem(itemId) {
      try {
        await apiCall('/modules/tasks/checklist-items/' + itemId + '/toggle', { method: 'POST' });
        loadTask();
      } catch (err) {
        alert(err.message);
      }
    }

    async function submitChoice(taskId) {
      const selected = document.querySelector('input[name="mcOption"]:checked');
      if (!selected) {
        alert('Please select an answer before submitting.');
        return;
      }
      if (!confirm('Once submitted, your choice is locked and cannot be changed. Submit now?')) {
        return;
      }
      try {
        await apiCall('/modules/tasks/' + taskId + '/submit-choice', {
          method: 'POST',
          body: JSON.stringify({ optionId: selected.value }),
        });
        loadTask();
      } catch (err) {
        alert(err.message);
      }
    }

    async function markComplete(taskId) {
      try {
        await apiCall('/modules/tasks/' + taskId + '/toggle', { method: 'POST' });
        loadTask();
      } catch (err) {
        alert(err.message);
      }
    }

    async function submitAnswer(taskId) {
      const answer = document.getElementById('answerBox').value;
      if (!answer.trim()) {
        alert('Please write an answer before submitting.');
        return;
      }
      if (!confirm('Once submitted, this answer is locked and cannot be changed. Submit now?')) {
        return;
      }
      try {
        await apiCall('/modules/tasks/' + taskId + '/submit-answer', {
          method: 'POST',
          body: JSON.stringify({ answer }),
        });
        loadTask();
      } catch (err) {
        alert(err.message);
      }
    }

    if (taskId) {
      loadTask();
    } else {
      document.getElementById('message').textContent = 'No task specified.';
    }
  </script>
</body>
</html>
