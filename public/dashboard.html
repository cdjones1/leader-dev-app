<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - Leadership Development Tracker</title>
  <style>
    body {
      font-family: -apple-system, sans-serif;
      background: #1a1a2e;
      color: #eee;
      margin: 0;
      padding: 32px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    h1 { font-size: 22px; margin: 0; }
    button {
      padding: 8px 16px;
      background: #374151;
      color: #eee;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #4b5563; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #16213e;
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      text-align: left;
      padding: 12px 16px;
      border-bottom: 1px solid #2a2a4a;
    }
    th { background: #0f172a; font-size: 13px; color: #aaa; text-transform: uppercase; }
    .tag {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }
    .tag-module_stalled { background: #7c2d12; color: #fed7aa; }
    .tag-plan_due_soon { background: #713f12; color: #fef9c3; }
    .tag-plan_overdue { background: #78350f; color: #fde68a; }
    .tag-assessment_needs_meeting { background: #713f12; color: #fef08a; }
    .tag-assessment_locked_final { background: #7f1d1d; color: #fecaca; }
    #message { color: #aaa; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Needs Attention</h1>
    <div id="navLinks">
      <button onclick="logout()">Log Out</button>
    </div>
  </div>

  <div id="message">Loading...</div>
  <table id="queueTable" style="display:none;">
    <thead>
      <tr>
        <th>Issue</th>
        <th>Since</th>
        <th>Developer</th>
        <th>Developee</th>
        <th>Plan ID</th>
      </tr>
    </thead>
    <tbody id="queueBody"></tbody>
  </table>

  <script>
    const token = localStorage.getItem('token');
    const userJson = localStorage.getItem('user');

    if (!token || !userJson) {
      window.location.href = '/index.html';
    }

    const user = JSON.parse(userJson);

    // This page is admin-only. A non-admin landing here (bookmark, back
    // button, etc.) should just go to their actual home page instead
    // of seeing a dead end.
    if (!user.isAdmin) {
      window.location.href = '/myplans.html';
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = '/index.html';
    }

    // Build the nav bar based on who's actually logged in - a non-admin
    // never even sees links to pages they can't use.
    function renderNav() {
      const navLinks = document.getElementById('navLinks');
      const links = [];
      if (user.isAdmin) {
        links.push('<a href="/module-content.html" style="color:#93c5fd; text-decoration:none; margin-right:16px;">Module Content</a>');
        links.push('<a href="/register.html" style="color:#93c5fd; text-decoration:none; margin-right:16px;">Register User</a>');
        links.push('<a href="/admin-setup.html" style="color:#93c5fd; text-decoration:none; margin-right:16px;">Admin Setup</a>');
      }
      links.push('<a href="/myplans.html" style="color:#93c5fd; text-decoration:none; margin-right:16px;">My Plans</a>');
      navLinks.innerHTML = links.join('') + '<button onclick="logout()">Log Out</button>';
    }
    renderNav();

    const reasonLabels = {
      module_stalled: 'Module Stalled',
      plan_due_soon: 'Plan Due Soon (30+ days)',
      plan_overdue: 'Plan Overdue',
      assessment_needs_meeting: 'Needs Developer Meeting',
      assessment_locked_final: 'Locked - Needs Admin',
    };

    async function loadDashboard() {
      const messageDiv = document.getElementById('message');
      const table = document.getElementById('queueTable');
      const tbody = document.getElementById('queueBody');

      try {
        const res = await fetch('/admin/needs-attention', {
          headers: { Authorization: 'Bearer ' + token },
        });

        if (res.status === 401) {
          logout(); // token expired or invalid - send back to login
          return;
        }

        const data = await res.json();

        if (!res.ok) {
          messageDiv.textContent = data.error || 'Something went wrong loading the dashboard.';
          return;
        }

        if (data.items.length === 0) {
          messageDiv.textContent = 'Nothing needs attention right now.';
          return;
        }

        messageDiv.style.display = 'none';
        table.style.display = 'table';

        for (const item of data.items) {
          const row = document.createElement('tr');
          const sinceDate = new Date(item.since).toLocaleDateString();
          row.innerHTML = `
            <td><span class="tag tag-${item.reason}">${reasonLabels[item.reason] || item.reason}</span></td>
            <td>${sinceDate}</td>
            <td>${item.developer}</td>
            <td>${item.developee}</td>
            <td style="font-family: monospace; font-size: 12px; color: #888;">${item.planId}</td>
          `;
          tbody.appendChild(row);
        }
      } catch (err) {
        messageDiv.textContent = 'Could not reach the server.';
      }
    }

    loadDashboard();
  </script>
</body>
</html>
