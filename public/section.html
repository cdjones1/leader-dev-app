<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Section</title>
  <style>
    :root {
      --accent: #d6222a; --accent-dark: #b71c23;
      --bg: #f7f5f2; --card: #ffffff; --border: #e7e3dd;
      --text: #1a1a1a; --text-muted: #6b6560;
    }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, "Helvetica Neue", sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 32px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    h1 { font-size: 22px; margin: 0; }
    a { color: var(--accent); text-decoration: none; }
    .task-block { background: var(--card); border: 1px solid var(--border); padding: 20px; border-radius: 10px; margin-bottom: 16px; }
    .task-block h3 { margin-top: 0; font-size: 15px; }
    .content-box { color: var(--text-muted); line-height: 1.6; white-space: pre-wrap; margin: 10px 0; }
    button {
      padding: 9px 16px; background: var(--accent); color: white;
      border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600;
    }
    button:hover { background: var(--accent-dark); }
    button:disabled { background: #d8d3cc; color: #a39d94; cursor: not-allowed; }
    textarea, input[type="text"] {
      width: 100%; padding: 9px; margin-top: 6px; border-radius: 6px;
      border: 1px solid var(--border); background: #fff; color: var(--text); box-sizing: border-box;
      font-family: inherit;
    }
    .answer-box { background: #f4f2ee; padding: 12px; border-radius: 6px; margin-top: 10px; white-space: pre-wrap; }
    .your-answer { border-left: 3px solid var(--accent); }
    .correct-answer { border-left: 3px solid #1a7a3a; margin-top: 10px; }
    .label { font-size: 11px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px; }
    .locked-note { color: var(--text-muted); font-size: 13px; margin-top: 6px; }
    .task-item { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
    .task-item.done { color: #a39d94; text-decoration: line-through; }
    #completeSection { margin-top: 24px; padding: 16px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; }
    #missingList { color: #9a5b00; font-size: 13px; margin-top: 8px; }
    #message { color: #9b1c1c; margin-top: 12px; }
    .notice-box {
      background: #eef4fc; border-left: 3px solid #3b82f6; border-radius: 8px;
      padding: 16px; margin-bottom: 16px;
    }
    .notice-box .notice-label {
      font-size: 11px; font-weight: 700; letter-spacing: 0.05em; color: #1e40af;
      text-transform: uppercase; margin-bottom: 6px;
    }
    .notice-box .notice-text { color: #1e3a5f; line-height: 1.6; white-space: pre-wrap; }
    .warning-box {
      background: #fdecec; border-left: 3px solid #ef4444; border-radius: 8px;
      padding: 16px; margin-bottom: 16px;
    }
    .warning-box .warning-label {
      font-size: 11px; font-weight: 700; letter-spacing: 0.05em; color: #9b1c1c;
      text-transform: uppercase; margin-bottom: 6px;
    }
    .warning-box .warning-text { color: #7a1414; line-height: 1.6; white-space: pre-wrap; }
    .not-yours { color: #9a5b00; margin-top: 8px; }

    .action-item {
      display: flex; gap: 14px; align-items: flex-start; background: var(--card);
      border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; margin-bottom: 16px;
    }
    .action-item.checked { background: #eefaf1; border-color: #bfe8cc; }
    .action-item input[type="checkbox"] { width: 22px; height: 22px; margin-top: 2px; accent-color: #1a7a3a; flex-shrink: 0; }
    .action-item.disabled input[type="checkbox"] { opacity: 0.5; }
    .action-item .ai-title { font-weight: 700; font-size: 16px; }
    .action-item .ai-desc { color: var(--text-muted); margin-top: 4px; }
    .action-item .ai-link { display: inline-block; margin-top: 8px; color: var(--accent); font-weight: 700; text-decoration: none; }

    .layout { display: flex; gap: 32px; max-width: 1100px; margin: 0 auto; align-items: flex-start; }
    .sidebar { width: 260px; flex-shrink: 0; position: sticky; top: 32px; }
    .sidebar-label { color: var(--text-muted); font-size: 12px; font-weight: 700; letter-spacing: 0.06em; margin-bottom: 10px; }
    .sidebar-item {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px;
      margin-bottom: 4px; cursor: pointer; text-decoration: none; color: var(--text);
    }
    .sidebar-item:hover { background: #f4f2ee; }
    .sidebar-item.current { background: #fdeaea; color: var(--accent); font-weight: 700; }
    .sidebar-dot { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; flex-shrink: 0; }
    .sidebar-dot.complete { background: #dcf7e3; color: #1a7a3a; }
    .sidebar-dot.partial { background: #fef3c7; color: #92700a; }
    .sidebar-dot.empty { background: #e9e5df; color: transparent; }
    .sidebar-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
    .all-done-box { text-align: center; padding: 10px; background: #eaf7ee; color: #1a7a3a; border-radius: 8px; font-weight: 700; font-size: 13px; margin-top: 6px; }
    .legend { border-top: 1px solid var(--border); margin-top: 16px; padding-top: 14px; font-size: 13px; color: var(--text-muted); }
    .legend-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .legend-dot { width: 12px; height: 12px; border-radius: 50%; }

    .main-col { flex: 1; min-width: 0; }
    .eyebrow-count { color: var(--accent); font-weight: 700; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px; }
    .section-heading { font-size: 32px; font-weight: 800; margin: 0 0 20px; }
    .footer-nav { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); margin-top: 24px; padding-top: 20px; }
    .prev-link { color: var(--text-muted); font-weight: 600; text-decoration: none; }
    .prev-link.disabled { visibility: hidden; }
    button.next-btn { background: #1a7a3a; padding: 13px 22px; font-size: 15px; }
    button.next-btn:hover { background: #14602e; }
  </style>
</head>
<body>
  <div class="header" style="max-width:1100px;">
    <h1 id="pageTitle">Loading...</h1>
    <a id="backLink" href="/dashboard.html">&larr; Back to Plan</a>
  </div>

  <div class="layout">
    <div class="sidebar">
      <div class="sidebar-label">SECTIONS</div>
      <div id="sidebarList"></div>
      <div class="legend">
        <div class="legend-row"><span class="legend-dot" style="background:#1a7a3a;"></span> Complete</div>
        <div class="legend-row"><span class="legend-dot" style="background:#92700a;"></span> Partially complete</div>
      </div>
    </div>
    <div class="main-col">
      <div class="eyebrow-count" id="sectionCount"></div>
      <h2 class="section-heading" id="sectionHeading"></h2>
      <div id="tasksContainer"></div>
      <div id="completeSection"></div>
      <div id="message"></div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    if (!token) window.location.href = '/index.html';

    const params = new URLSearchParams(window.location.search);
    const sectionId = params.get('id');
    const planId = params.get('planId');
    if (planId) document.getElementById('backLink').href = '/plan.html?id=' + planId;

    async function apiCall(url, options = {}) {
      const res = await fetch(url, {
        ...options,
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token, ...(options.headers || {}) },
      });
      const data = await res.json();
      if (!res.ok) { const err = new Error(data.error || 'Request failed'); err.missing = data.missing; throw err; }
      return data;
    }

    let currentPlan = null;
    let currentSection = null;

    function isMyTask(task) {
      if (user.isAdmin) return true;
      if (!currentPlan) return true; // fail open on viewing - server still enforces the real rule
      const myId = user.id;
      if (task.assignedTo === 'DEVELOPER') return currentPlan.pairing.developer.id === myId;
      return currentPlan.pairing.developee.id === myId;
    }

    function readingBlock(task) {
      return `<div class="task-block"><h3>${task.text}</h3><div class="content-box">${task.content || '(No content written yet.)'}</div></div>`;
    }

    // Turns a plain YouTube/Vimeo URL into an embeddable player URL.
    // Falls back to a direct <video> tag for file links, or a plain
    // link if the format isn't recognized at all.
    function videoEmbedUrl(url) {
      const ytMatch = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]+)/);
      if (ytMatch) return { type: 'iframe', src: `https://www.youtube.com/embed/${ytMatch[1]}` };

      const vimeoMatch = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
      if (vimeoMatch) return { type: 'iframe', src: `https://player.vimeo.com/video/${vimeoMatch[1]}` };

      if (/\.(mp4|webm|ogg)(\?.*)?$/i.test(url)) return { type: 'video', src: url };

      return { type: 'link', src: url };
    }

    function videoBlock(task) {
      const embed = task.link ? videoEmbedUrl(task.link) : null;
      let playerHtml = '<p style="color:var(--text-muted);">(No video link set.)</p>';
      if (embed) {
        if (embed.type === 'iframe') {
          playerHtml = `<div style="position:relative; padding-bottom:56.25%; height:0; border-radius:8px; overflow:hidden;">
            <iframe src="${embed.src}" style="position:absolute; top:0; left:0; width:100%; height:100%; border:0;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
          </div>`;
        } else if (embed.type === 'video') {
          playerHtml = `<video controls style="width:100%; border-radius:8px;"><source src="${embed.src}"></video>`;
        } else {
          playerHtml = `<a href="${embed.src}" target="_blank" rel="noopener">Open video &#8599;</a>`;
        }
      }
      return `
        <div class="task-block">
          <h3>${task.text}</h3>
          ${playerHtml}
          ${task.content ? `<div class="content-box">${task.content}</div>` : ''}
        </div>
      `;
    }

    function actionItemBlock(task) {
      const mine = isMyTask(task);
      return `
        <label class="action-item ${task.completed ? 'checked' : ''} ${mine ? '' : 'disabled'}">
          <input type="checkbox" ${task.completed ? 'checked' : ''} ${mine ? '' : 'disabled'} onchange="toggleActionItem('${task.id}')">
          <div>
            <div class="ai-title">${task.text}</div>
            ${task.content ? `<div class="ai-desc">${task.content}</div>` : ''}
            ${task.link ? `<a class="ai-link" href="${task.link}" target="_blank" rel="noopener">Open link &#8599;</a>` : ''}
          </div>
        </label>
      `;
    }

    function noticeBlock(task) {
      return `<div class="notice-box"><div class="notice-label">Info</div><div class="notice-text">${task.content || ''}</div></div>`;
    }

    function warningBlock(task) {
      return `<div class="warning-box"><div class="warning-label">Important</div><div class="warning-text">${task.content || ''}</div></div>`;
    }

    function questionBlock(task, mine) {
      const contentHtml = task.content ? `<div class="content-box">${task.content}</div>` : '';
      if (!task.submittedAt) {
        if (!mine) {
          return `<div class="task-block"><h3>${task.text}</h3>${contentHtml}<p class="not-yours">Not your task to answer.</p></div>`;
        }
        return `
          <div class="task-block">
            <h3>${task.text}</h3>
            ${contentHtml}
            <textarea id="answer-${task.id}" rows="4" placeholder="Your answer..."></textarea>
            <div class="locked-note">Locks permanently once submitted.</div>
            <button style="margin-top:8px;" onclick="submitAnswer('${task.id}')">Submit Answer</button>
          </div>
        `;
      }
      return `
        <div class="task-block">
          <h3>${task.text}</h3>
          ${contentHtml}
          <div class="answer-box your-answer"><div class="label">Submitted Answer</div>${task.submittedAnswer}</div>
          <div class="answer-box correct-answer"><div class="label">Correct Answer</div>${task.correctAnswer}</div>
        </div>
      `;
    }

    function checklistBlock(task, mine) {
      const contentHtml = task.content ? `<div class="content-box">${task.content}</div>` : '';
      const itemsHtml = task.checklistItems.map((item) => `
        <label class="action-item ${item.completed ? 'checked' : ''} ${mine ? '' : 'disabled'}" style="margin-bottom:10px;">
          <input type="checkbox" ${item.completed ? 'checked' : ''} ${mine ? '' : 'disabled'} onchange="toggleChecklistItem('${item.id}')">
          <div>
            <div class="ai-title">${item.text}</div>
            ${item.description ? `<div class="ai-desc">${item.description}</div>` : ''}
            ${item.link ? `<a class="ai-link" href="${item.link}" target="_blank" rel="noopener">Open link &#8599;</a>` : ''}
          </div>
        </label>
      `).join('');
      return `<div class="task-block"><h3>${task.text}</h3>${contentHtml}<div>${itemsHtml}</div>${mine ? '' : '<p class="not-yours">Not your task to check off.</p>'}</div>`;
    }

    function multipleChoiceBlock(task, mine) {
      const contentHtml = task.content ? `<div class="content-box">${task.content}</div>` : '';
      if (!task.selectedOptionId) {
        if (!mine) {
          const optsHtml = task.choiceOptions.map((o) => `<div style="padding:4px 0;">${o.text}</div>`).join('');
          return `<div class="task-block"><h3>${task.text}</h3>${contentHtml}<div>${optsHtml}</div><p class="not-yours">Not your task to answer.</p></div>`;
        }
        const optsHtml = task.choiceOptions.map((o) => `
          <label class="task-item"><input type="radio" name="mc-${task.id}" value="${o.id}">${o.text}</label>
        `).join('');
        return `
          <div class="task-block">
            <h3>${task.text}</h3>
            ${contentHtml}
            <div>${optsHtml}</div>
            <div class="locked-note">Locks permanently once submitted.</div>
            <button style="margin-top:8px;" onclick="submitChoice('${task.id}')">Submit Answer</button>
          </div>
        `;
      }
      const resultHtml = task.choiceOptions.map((o) => {
        const isMine = o.id === task.selectedOptionId;
        const style = o.isCorrect ? 'color:#1a7a3a; font-weight:600;' : (isMine ? 'color:#9b1c1c;' : 'color:#6b6560;');
        return `<div style="padding:4px 0; ${style}">${isMine ? '→ ' : '　 '}${o.text}${o.isCorrect ? ' (correct)' : ''}</div>`;
      }).join('');
      return `
        <div class="task-block">
          <h3>${task.text}</h3>
          ${contentHtml}
          <div>${resultHtml}</div>
          <p style="margin-top:8px; font-weight:600; color:${task.isCorrect ? '#1a7a3a' : '#9b1c1c'};">${task.isCorrect ? 'Correct!' : 'Incorrect.'}</p>
        </div>
      `;
    }

    // Finds this section's position among its siblings within the same
    // module, using the full plan (which has modules -> sections in order).
    function findSectionContext(section) {
      if (!currentPlan) return { index: -1, siblings: [], isLast: false, nextSection: null, previousSection: null };
      const module = currentPlan.modules.find((m) => m.id === section.moduleId);
      if (!module) return { index: -1, siblings: [], isLast: false, nextSection: null, previousSection: null };
      const siblings = module.sections; // already ordered by the server
      const index = siblings.findIndex((s) => s.id === section.id);
      const isLast = index === siblings.length - 1;
      const nextSection = isLast ? null : siblings[index + 1];
      const previousSection = index > 0 ? siblings[index - 1] : null;
      return { index, siblings, isLast, nextSection, previousSection, moduleId: module.id };
    }

    // A section with no completed status but at least one task touched
    // (an answer submitted, a choice picked, some checklist items checked)
    // shows as "partially complete" in the sidebar - purely a display
    // hint, not a stored state.
    function isPartiallyStarted(section) {
      if (section.completed) return false;
      return (section.tasks || []).some((t) =>
        t.submittedAt || t.selectedOptionId || t.completed || (t.checklistItems || []).some((i) => i.completed)
      );
    }

    function renderSidebar(context, currentSectionId) {
      const listDiv = document.getElementById('sidebarList');
      const rows = context.siblings.map((s) => {
        const isCurrent = s.id === currentSectionId;
        let dotClass = 'empty', dotGlyph = '';
        if (s.completed) { dotClass = 'complete'; dotGlyph = '✓'; }
        else if (isPartiallyStarted(s)) { dotClass = 'partial'; dotGlyph = '●'; }
        return `
          <a class="sidebar-item ${isCurrent ? 'current' : ''}" href="/section.html?id=${s.id}&planId=${planId}">
            <span class="sidebar-dot ${dotClass}">${dotGlyph}</span>
            <span class="sidebar-title">${s.title}</span>
          </a>
        `;
      }).join('');

      const allDone = context.siblings.length > 0 && context.siblings.every((s) => s.completed);
      listDiv.innerHTML = rows + (allDone ? '<div class="all-done-box">✓ All sections done</div>' : '');
    }

    async function loadSection() {
      try {
        const section = await apiCall('/sections/' + sectionId);
        currentSection = section;
        if (planId) {
          try { currentPlan = await apiCall('/plans/' + planId); } catch (e) { currentPlan = null; }
        }

        document.getElementById('pageTitle').textContent = section.title;
        document.getElementById('sectionHeading').textContent = section.title;

        const context = findSectionContext(section);
        if (context.siblings.length > 0) {
          document.getElementById('sectionCount').textContent = `Section ${context.index + 1} of ${context.siblings.length}`;
          renderSidebar(context, section.id);
        }

        const blocksHtml = section.tasks.map((t) => {
          const mine = isMyTask(t);
          if (t.taskType === 'READING') return readingBlock(t);
          if (t.taskType === 'NOTICE') return noticeBlock(t);
          if (t.taskType === 'WARNING') return warningBlock(t);
          if (t.taskType === 'QUESTION') return questionBlock(t, mine);
          if (t.taskType === 'CHECKLIST') return checklistBlock(t, mine);
          if (t.taskType === 'MULTIPLE_CHOICE') return multipleChoiceBlock(t, mine);
          if (t.taskType === 'ACTION_ITEM') return actionItemBlock(t);
          if (t.taskType === 'VIDEO') return videoBlock(t);
          return '';
        }).join('');
        document.getElementById('tasksContainer').innerHTML = blocksHtml;

        const { isLast, nextSection, previousSection } = context;
        const completeDiv = document.getElementById('completeSection');

        const prevHtml = previousSection
          ? `<a class="prev-link" href="/section.html?id=${previousSection.id}&planId=${planId}">&larr; Previous</a>`
          : `<span class="prev-link disabled">&larr; Previous</span>`;

        if (section.completed) {
          // Already done - just offer plain navigation, no re-validation needed.
          if (isLast) {
            completeDiv.innerHTML = `
              <div class="footer-nav">
                ${prevHtml}
                <p style="color:#1a7a3a; font-weight:600; margin:0;">This section is complete - it was the last one in this module.</p>
              </div>
            `;
          } else if (nextSection) {
            completeDiv.innerHTML = `
              <div class="footer-nav">
                ${prevHtml}
                <button class="next-btn" onclick="goToSection('${nextSection.id}')">Next section &rarr;</button>
              </div>
            `;
          }
        } else {
          // Not yet complete: one button, available to any participant -
          // clicking it validates that every task in the section is
          // actually done (each task's own action already enforced who
          // was allowed to complete THAT specific piece). If something's
          // still missing, the same warning list shows instead of
          // letting anyone skip ahead.
          const label = isLast ? 'Complete Module' : 'Next section &rarr;';
          completeDiv.innerHTML = `
            <div class="footer-nav">
              ${prevHtml}
              <button class="next-btn" onclick="completeAndAdvance()">${label}</button>
            </div>
            <div id="missingList"></div>
          `;
        }
      } catch (err) {
        document.getElementById('message').textContent = err.message;
      }
    }

    function goToSection(id) {
      window.location.href = '/section.html?id=' + id + '&planId=' + planId;
    }

    async function submitAnswer(taskId) {
      const answer = document.getElementById('answer-' + taskId).value;
      if (!answer.trim()) { alert('Please write an answer first.'); return; }
      if (!confirm('This locks permanently once submitted. Continue?')) return;
      try {
        await apiCall('/modules/tasks/' + taskId + '/submit-answer', { method: 'POST', body: JSON.stringify({ answer }) });
        loadSection();
      } catch (err) {
        alert(err.message);
      }
    }

    async function toggleChecklistItem(itemId) {
      try {
        await apiCall('/modules/tasks/checklist-items/' + itemId + '/toggle', { method: 'POST' });
        loadSection();
      } catch (err) {
        alert(err.message);
      }
    }

    async function toggleActionItem(taskId) {
      try {
        await apiCall('/modules/tasks/' + taskId + '/toggle', { method: 'POST' });
        loadSection();
      } catch (err) {
        alert(err.message);
      }
    }

    async function submitChoice(taskId) {
      const selected = document.querySelector(`input[name="mc-${taskId}"]:checked`);
      if (!selected) { alert('Please select an answer first.'); return; }
      if (!confirm('This locks permanently once submitted. Continue?')) return;
      try {
        await apiCall('/modules/tasks/' + taskId + '/submit-choice', { method: 'POST', body: JSON.stringify({ optionId: selected.value }) });
        loadSection();
      } catch (err) {
        alert(err.message);
      }
    }

    async function completeAndAdvance() {
      const missingDiv = document.getElementById('missingList');
      try {
        await apiCall('/sections/' + sectionId + '/complete', { method: 'POST' });
      } catch (err) {
        if (err.missing && missingDiv) {
          missingDiv.innerHTML = 'Still needed before you can continue: <ul>' + err.missing.map((m) => `<li>${m}</li>`).join('') + '</ul>';
        } else {
          alert(err.message);
        }
        return; // stop here - do not advance if the section wasn't actually ready
      }

      const { isLast, nextSection, moduleId } = findSectionContext(currentSection);

      if (!isLast && nextSection) {
        goToSection(nextSection.id);
        return;
      }

      if (isLast) {
        // Finishing the last section also completes the whole module -
        // no separate trip back to the plan page needed just for that.
        try {
          await apiCall('/modules/' + moduleId + '/complete', { method: 'POST' });
        } catch (err) {
          alert('Section completed, but the module could not be marked complete: ' + err.message);
        }
        window.location.href = '/plan.html?id=' + planId;
      }
    }

    if (sectionId) loadSection();
    else document.getElementById('message').textContent = 'No section specified.';
  </script>
</body>
</html>
