<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Development Plan</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #1a1a2e; color: #eee; margin: 0; padding: 32px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    h1 { font-size: 22px; margin: 0; }
    a { color: #93c5fd; text-decoration: none; }
    button {
      padding: 8px 16px; background: #4f46e5; color: white; border: none;
      border-radius: 6px; cursor: pointer; font-size: 14px;
    }
    button:hover { background: #4338ca; }
    button:disabled { background: #374151; cursor: not-allowed; }
    .module-row {
      display: flex; justify-content: space-between; align-items: center;
      background: #16213e; padding: 16px 20px; border-radius: 8px; margin-bottom: 8px;
    }
    .module-name { font-weight: 600; }
    .tag { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; margin-left: 10px; }
    .tag-NOT_STARTED { background: #374151; color: #d1d5db; }
    .tag-OPEN { background: #1e3a8a; color: #bfdbfe; }
    .tag-COMPLETED { background: #14532d; color: #bbf7d0; }
    .tag-LOCKED { background: #7f1d1d; color: #fecaca; }
    .assessment-box {
      background: #16213e; padding: 20px; border-radius: 8px; margin-top: 16px;
      border: 1px solid #4f46e5;
    }
    .assessment-box h3 { margin-top: 0; }
    .task-checklist { margin-top: 8px; padding-left: 8px; }
    .task-item { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 14px; color: #ccc; }
    .task-item input { width: auto; margin: 0; }
    .task-item.done { color: #6b7280; text-decoration: line-through; }
    .module-description { color: #9ca3af; font-size: 14px; margin: 6px 0 0 0; }
    label { display: block; margin-top: 12px; font-size: 14px; color: #aaa; }
    input, select, textarea {
      width: 100%; padding: 8px; margin-top: 4px; border-radius: 6px;
      border: 1px solid #333; background: #0f172a; color: #eee; box-sizing: border-box;
    }
    .day-banner {
      background: #713f12; color: #fef9c3; padding: 12px 20px; border-radius: 8px;
      margin-bottom: 16px; font-weight: 600;
    }
    #message { color: #aaa; margin-top: 16px; }
    .date-info { color: #93c5fd; font-size: 14px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <div class="header">
    <h1 id="pageTitle">Development Plan</h1>
    <a href="/dashboard.html">&larr; Back to Dashboard</a>
  </div>

  <div id="dateInfo" class="date-info"></div>
  <div id="dayBanner"></div>
  <div id="modulesList"></div>
  <div id="assessmentSection"></div>
  <div id="message"></div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/index.html';

    const params = new URLSearchParams(window.location.search);
    const planId = params.get('id');

    if (!planId) {
      document.getElementById('message').textContent = 'No plan specified. Go back to the dashboard and pick a plan.';
    }

    async function apiCall(url, options = {}) {
      const res = await fetch(url, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          Authorization: 'Bearer ' + token,
          ...(options.headers || {}),
        },
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    }

    function moduleRowHtml(module, planAssessments, allModules) {
      let canOpen = module.status === 'NOT_STARTED';

      // General sequencing rule, matching the server: module N (other
      // than 1) needs module N-1 actually completed first.
      if (canOpen && module.sequenceOrder > 1) {
        const previousModule = allModules.find((m) => m.sequenceOrder === module.sequenceOrder - 1);
        if (!previousModule || previousModule.status !== 'COMPLETED') {
          canOpen = false;
        }
      }

      // Module 5 has the additional midterm-assessment gate on top.
      if (module.sequenceOrder === 5 && canOpen) {
        const midterm = planAssessments.find((a) => a.gatePosition === 'AFTER_MODULE_4');
        if (!midterm || midterm.status !== 'PASSED') {
          canOpen = false;
        }
      }

      const canComplete = module.status === 'OPEN';

      const taskListHtml = (module.tasks && module.tasks.length > 0) ? `
        <div class="task-checklist">
          ${module.tasks.map((t) => `
            <label class="task-item ${t.completed ? 'done' : ''}">
              <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTask('${t.id}')">
              ${t.text}
            </label>
          `).join('')}
        </div>
      ` : '';

      return `
        <div class="module-row" style="flex-direction:column; align-items:stretch;">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div>
              <span class="module-name">Module ${module.sequenceOrder}${module.title ? ': ' + module.title : ''}</span>
              <span class="tag tag-${module.status}">${module.status.replace('_', ' ')}</span>
            </div>
            <div>
              <button ${canOpen ? '' : 'disabled'} onclick="openModule('${module.id}')">Open</button>
              <button ${canComplete ? '' : 'disabled'} onclick="completeModule('${module.id}')">Mark Complete</button>
            </div>
          </div>
          ${module.description ? `<p class="module-description">${module.description}</p>` : ''}
          ${taskListHtml}
        </div>
      `;
    }

    async function toggleTask(taskId) {
      try {
        await apiCall('/modules/tasks/' + taskId + '/toggle', { method: 'POST' });
        loadPlan();
      } catch (err) {
        alert(err.message);
      }
    }

    function assessmentBoxHtml(assessment, isDeveloperHere) {
      if (!assessment) return '';
      const gradeable = ['PENDING', 'IN_PROGRESS'].includes(assessment.status);
      const label = assessment.gatePosition === 'AFTER_MODULE_4' ? 'Midterm Assessment' : 'Final Assessment';
      const isAdmin = JSON.parse(localStorage.getItem('user')).isAdmin;

      if (assessment.status === 'LOCKED_NEEDS_MEETING') {
        return `
          <div class="assessment-box">
            <h3>${label}</h3>
            <p>Status: <strong>Locked - Needs Developer Meeting</strong></p>
            <p>Two attempts have failed. A follow-up meeting between developer and developee is required before a third attempt is allowed.</p>
            ${isDeveloperHere || isAdmin
              ? `<button onclick="reopenAfterMeeting('${assessment.id}')">I've held the meeting - Reopen for attempt 3</button>`
              : `<p style="color:#888;">Your developer needs to confirm the meeting happened before this can continue.</p>`}
          </div>
        `;
      }

      if (assessment.status === 'LOCKED_FINAL') {
        return `
          <div class="assessment-box">
            <h3>${label}</h3>
            <p>Status: <strong>Locked - Needs Admin</strong></p>
            <p>All attempts have failed. This requires admin resolution.</p>
            ${isAdmin
              ? `<button onclick="adminReopenForRetry('${assessment.id}')">Grant One More Attempt</button>
                 <button style="margin-left:8px; background:#7f1d1d;" onclick="adminOverridePass('${assessment.id}')">Override to Pass</button>`
              : `<p style="color:#888;">Only an admin can resolve this.</p>`}
          </div>
        `;
      }

      if (!gradeable) {
        return `
          <div class="assessment-box">
            <h3>${label}</h3>
            <p>Status: <strong>${assessment.status.replace(/_/g, ' ')}</strong></p>
          </div>
        `;
      }

      // It's gradeable, but only the developer (or an admin) actually
      // grades it - a developee just sees that it's waiting on them.
      if (!isDeveloperHere && !isAdmin) {
        return `
          <div class="assessment-box">
            <h3>${label}</h3>
            <p>Status: <strong>Waiting on your developer to grade this</strong></p>
          </div>
        `;
      }

      const attemptLabel = assessment.attemptCount < 3
        ? `Attempt ${assessment.attemptCount + 1} of 3`
        : `Extra Attempt ${assessment.attemptCount + 1} (admin-granted)`;

      return `
        <div class="assessment-box">
          <h3>${label} - ${attemptLabel}</h3>
          <label>Score (1-10)</label>
          <input type="number" id="score" min="1" max="10" value="5">
          <label>Comments</label>
          <textarea id="comments" rows="3"></textarea>
          <label>Overall Result</label>
          <select id="overallResult">
            <option value="PASS">Pass</option>
            <option value="FAIL">Fail</option>
          </select>
          <button style="margin-top:16px;" onclick="gradeAssessment('${assessment.id}')">Submit Grade</button>
        </div>
      `;
    }

    async function loadPlan() {
      try {
        const plan = await apiCall('/plans/' + planId);
        document.getElementById('pageTitle').textContent =
          `Plan: ${plan.pairing.developee.name} (developed by ${plan.pairing.developer.name})`;

        // Start/due dates and the reminder banner all key off startedAt -
        // the moment module 1 was actually opened, not when the plan
        // record itself was created.
        const dateInfoDiv = document.getElementById('dateInfo');
        const bannerDiv = document.getElementById('dayBanner');

        if (!plan.startedAt) {
          dateInfoDiv.textContent = 'Not started yet - the 40-day clock begins once Module 1 is opened.';
          bannerDiv.innerHTML = '';
        } else {
          const startDate = new Date(plan.startedAt);
          const dueDate = new Date(startDate.getTime() + 40 * 24 * 60 * 60 * 1000);
          dateInfoDiv.textContent = `Start Date: ${startDate.toLocaleDateString()}  |  Due Date: ${dueDate.toLocaleDateString()}`;

          if (plan.status === 'IN_PROGRESS') {
            const daysElapsed = Math.floor((Date.now() - startDate) / (1000 * 60 * 60 * 24));
            if (daysElapsed >= 40) {
              bannerDiv.innerHTML = `<div class="day-banner" style="background:#7f1d1d; color:#fecaca;">This plan is past its 40-day mark (day ${daysElapsed}) and is not yet complete.</div>`;
            } else if (daysElapsed >= 30) {
              bannerDiv.innerHTML = `<div class="day-banner">Reminder: this development plan is due within ${40 - daysElapsed} day(s) (day ${daysElapsed} of 40).</div>`;
            } else {
              bannerDiv.innerHTML = '';
            }
          } else {
            bannerDiv.innerHTML = '';
          }
        }

        document.getElementById('modulesList').innerHTML = plan.modules.map((m) => {
          let row = moduleRowHtml(m, plan.assessments, plan.modules);
          if (m.sequenceOrder === 4) {
            const review = plan.reviewSteps.find((r) => r.gatePosition === 'AFTER_MODULE_4');
            row += reviewStepHtml(review, 'Study and Review (Modules 1-4)');
          }
          if (m.sequenceOrder === 8) {
            const review = plan.reviewSteps.find((r) => r.gatePosition === 'AFTER_MODULE_8');
            row += reviewStepHtml(review, 'Study and Review (Modules 5-8)');
          }
          return row;
        }).join('');

        // Find the assessment that's currently relevant (not yet PASSED)
        const activeAssessment = plan.assessments.find((a) => a.status !== 'PASSED');
        const currentUserId = JSON.parse(localStorage.getItem('user')).id;
        const isDeveloperHere = plan.pairing.developer.id === currentUserId;
        document.getElementById('assessmentSection').innerHTML = assessmentBoxHtml(activeAssessment, isDeveloperHere);
      } catch (err) {
        document.getElementById('message').textContent = err.message;
      }
    }

    function reviewStepHtml(reviewStep, label) {
      if (!reviewStep) return '';
      if (reviewStep.status === 'COMPLETED') {
        return `
          <div class="module-row">
            <div><span class="module-name">${label}</span> <span class="tag tag-COMPLETED">COMPLETED</span></div>
          </div>
        `;
      }
      return `
        <div class="module-row">
          <div><span class="module-name">${label}</span> <span class="tag tag-OPEN">OPEN</span></div>
          <div><button onclick="completeReviewStep('${reviewStep.id}')">Mark Reviewed</button></div>
        </div>
      `;
    }

    async function completeReviewStep(reviewStepId) {
      try {
        await apiCall('/review-steps/' + reviewStepId + '/complete', { method: 'POST' });
        loadPlan();
      } catch (err) {
        alert(err.message);
      }
    }

    async function openModule(moduleId) {
      try {
        await apiCall('/modules/' + moduleId + '/open', { method: 'POST' });
        loadPlan();
      } catch (err) {
        alert(err.message);
      }
    }

    async function completeModule(moduleId) {
      try {
        await apiCall('/modules/' + moduleId + '/complete', { method: 'POST' });
        loadPlan();
      } catch (err) {
        alert(err.message);
      }
    }

    async function gradeAssessment(assessmentId) {
      const score = parseInt(document.getElementById('score').value, 10);
      const comments = document.getElementById('comments').value;
      const overallResult = document.getElementById('overallResult').value;

      try {
        await apiCall('/assessments/' + assessmentId + '/grade', {
          method: 'POST',
          body: JSON.stringify({
            overallResult,
            itemScores: [{ moduleId: 'combined', score, comments }],
          }),
        });
        loadPlan();
      } catch (err) {
        alert(err.message);
      }
    }

    async function reopenAfterMeeting(assessmentId) {
      try {
        await apiCall('/assessments/' + assessmentId + '/reopen-after-meeting', { method: 'POST' });
        loadPlan();
      } catch (err) {
        alert(err.message);
      }
    }

    async function adminOverridePass(assessmentId) {
      if (!confirm('This will mark the assessment as PASSED and unlock the next step, bypassing normal grading. Continue?')) {
        return;
      }
      try {
        await apiCall('/assessments/' + assessmentId + '/admin-override-pass', { method: 'POST' });
        loadPlan();
      } catch (err) {
        alert(err.message);
      }
    }

    async function adminReopenForRetry(assessmentId) {
      if (!confirm('This will allow one more real attempt - they will need to actually pass it. Continue?')) {
        return;
      }
      try {
        await apiCall('/assessments/' + assessmentId + '/admin-reopen-for-retry', { method: 'POST' });
        loadPlan();
      } catch (err) {
        alert(err.message);
      }
    }

    if (planId) loadPlan();
  </script>
</body>
</html>
