<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Plans</title>
  <style>
    :root {
      --accent: #d6222a; --accent-dark: #b71c23;
      --bg: #f7f5f2; --card: #ffffff; --border: #e7e3dd;
      --text: #1a1a1a; --text-muted: #6b6560;
    }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, "Helvetica Neue", sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 32px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    h1 { font-size: 28px; margin: 0; }
    a.back { color: var(--accent); text-decoration: none; }
    button { padding: 9px 16px; background: var(--accent); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
    button:hover { background: var(--accent-dark); }
    .plan-row {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--card); border: 1px solid var(--border); padding: 18px 20px; border-radius: 10px; margin-bottom: 10px;
      text-decoration: none; color: var(--text);
    }
    .plan-row:hover { border-color: var(--accent); background: #fff7f5; }
    .tag { display: inline-block; padding: 4px 12px; border-radius: 14px; font-size: 12px; font-weight: 700; }
    .tag-IN_PROGRESS { background: #dbeafe; color: #1e40af; }
    .tag-COMPLETE { background: #dcf7e3; color: #1a7a3a; }
    #message { color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="header">
    <h1 id="pageTitle">My Plans</h1>
    <div id="navLinks">
      <button onclick="logout()">Log Out</button>
    </div>
  </div>

  <div id="message">Loading...</div>
  <div id="plansList"></div>

  <script>
    const token = localStorage.getItem('token');
    const userJson = localStorage.getItem('user');
    if (!token || !userJson) window.location.href = '/index.html';

    const user = JSON.parse(userJson);
    document.getElementById('pageTitle').textContent = `Welcome, ${user.name}`;

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = '/index.html';
    }

    function renderNav() {
      const navLinks = document.getElementById('navLinks');
      const links = [];
      if (user.isAdmin) {
        links.push('<a href="/dashboard.html" style="color:var(--accent); text-decoration:none; margin-right:16px;">Admin Dashboard</a>');
      }
      navLinks.innerHTML = links.join('') + '<button onclick="logout()">Log Out</button>';
    }
    renderNav();

    async function loadPlans() {
      const messageDiv = document.getElementById('message');
      const listDiv = document.getElementById('plansList');
      try {
        const res = await fetch('/plans/mine', { headers: { Authorization: 'Bearer ' + token } });
        if (res.status === 401) { logout(); return; }
        const plans = await res.json();

        if (plans.length === 0) {
          messageDiv.textContent = "You're not on any development plans yet.";
          return;
        }

        messageDiv.style.display = 'none';
        listDiv.innerHTML = plans.map((p) => `
          <a class="plan-row" href="/plan.html?id=${p.planId}">
            <div>
              <strong>${p.developee}</strong> (developed by ${p.developer})
              <span style="color:var(--text-muted); margin-left:8px;">- you are the ${p.myRole.toLowerCase()}</span>
              ${p.pathName ? `<span style="color:var(--text-muted); margin-left:8px;">· ${p.pathName}</span>` : ''}
            </div>
            <span class="tag tag-${p.status}">${p.status.replace('_', ' ')}</span>
          </a>
        `).join('');
      } catch (err) {
        messageDiv.textContent = 'Could not load your plans.';
      }
    }

    loadPlans();
  </script>
</body>
</html>
