<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Plans</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #1a1a2e; color: #eee; margin: 0; padding: 32px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    h1 { font-size: 22px; margin: 0; }
    a.back { color: #93c5fd; text-decoration: none; }
    button { padding: 8px 16px; background: #374151; color: #eee; border: none; border-radius: 6px; cursor: pointer; }
    .plan-row {
      display: flex; justify-content: space-between; align-items: center;
      background: #16213e; padding: 16px 20px; border-radius: 8px; margin-bottom: 8px;
      text-decoration: none; color: #eee;
    }
    .plan-row:hover { background: #1e2a4a; }
    .tag { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
    .tag-IN_PROGRESS { background: #1e3a8a; color: #bfdbfe; }
    .tag-COMPLETE { background: #14532d; color: #bbf7d0; }
    #message { color: #aaa; }
  </style>
</head>
<body>
  <div class="header">
    <h1>My Plans</h1>
    <div>
      <a class="back" href="/dashboard.html">Dashboard</a> &nbsp;
      <button onclick="logout()">Log Out</button>
    </div>
  </div>

  <div id="message">Loading...</div>
  <div id="plansList"></div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/index.html';

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = '/index.html';
    }

    async function loadPlans() {
      const messageDiv = document.getElementById('message');
      const listDiv = document.getElementById('plansList');
      try {
        const res = await fetch('/plans/mine', { headers: { Authorization: 'Bearer ' + token } });
        if (res.status === 401) { logout(); return; }
        const plans = await res.json();

        if (plans.length === 0) {
          messageDiv.textContent = "You're not on any development plans yet.";
          return;
        }

        messageDiv.style.display = 'none';
        listDiv.innerHTML = plans.map((p) => `
          <a class="plan-row" href="/plan.html?id=${p.planId}">
            <div>
              <strong>${p.developee}</strong> (developed by ${p.developer})
              <span style="color:#888; margin-left:8px;">- you are the ${p.myRole.toLowerCase()}</span>
            </div>
            <span class="tag tag-${p.status}">${p.status.replace('_', ' ')}</span>
          </a>
        `).join('');
      } catch (err) {
        messageDiv.textContent = 'Could not load your plans.';
      }
    }

    loadPlans();
  </script>
</body>
</html>
