<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Setup</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #1a1a2e; color: #eee; margin: 0; padding: 32px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    h1 { font-size: 22px; margin: 0; }
    a { color: #93c5fd; text-decoration: none; }
    .card { background: #16213e; padding: 20px; border-radius: 8px; margin-bottom: 24px; }
    h2 { font-size: 16px; margin-top: 0; }
    label { display: block; margin-top: 12px; font-size: 14px; color: #aaa; }
    select, input {
      width: 100%; padding: 8px; margin-top: 4px; border-radius: 6px;
      border: 1px solid #333; background: #0f172a; color: #eee; box-sizing: border-box;
    }
    button {
      margin-top: 16px; padding: 10px 18px; background: #4f46e5; color: white;
      border: none; border-radius: 6px; cursor: pointer; font-size: 14px;
    }
    button:hover { background: #4338ca; }
    .pairing-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 0; border-bottom: 1px solid #2a2a4a;
    }
    .pairing-row:last-child { border-bottom: none; }
    #message { color: #86efac; margin-top: 12px; }
    #errorMessage { color: #f87171; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Admin Setup</h1>
    <a href="/dashboard.html">&larr; Back to Dashboard</a>
  </div>

  <div class="card">
    <h2>Create a New Pairing</h2>
    <label>Developer</label>
    <select id="developerSelect"></select>
    <label>Developee</label>
    <select id="developeeSelect"></select>
    <button onclick="createPairing()">Create Pairing</button>
    <div id="message"></div>
    <div id="errorMessage"></div>
  </div>

  <div class="card">
    <h2>Existing Pairings</h2>
    <div id="pairingsList">Loading...</div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    if (!token) window.location.href = '/index.html';
    if (!user.isAdmin) {
      document.body.innerHTML = '<p>This page is admin-only.</p>';
      throw new Error('not admin');
    }

    async function apiCall(url, options = {}) {
      const res = await fetch(url, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          Authorization: 'Bearer ' + token,
          ...(options.headers || {}),
        },
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    }

    let allUsers = [];

    async function loadUsers() {
      allUsers = await apiCall('/admin/users');
      const options = allUsers.map((u) => `<option value="${u.id}">${u.name} (${u.role})</option>`).join('');
      document.getElementById('developerSelect').innerHTML = options;
      document.getElementById('developeeSelect').innerHTML = options;
    }

    async function loadPairings() {
      const pairings = await apiCall('/pairings');
      const listDiv = document.getElementById('pairingsList');

      if (pairings.length === 0) {
        listDiv.textContent = 'No pairings yet.';
        return;
      }

      listDiv.innerHTML = pairings.map((p) => `
        <div class="pairing-row">
          <div><strong>${p.developee.name}</strong> developed by <strong>${p.developer.name}</strong> (${p.status})</div>
          <button onclick="startPlan('${p.id}')">Start Plan</button>
        </div>
      `).join('');
    }

    async function createPairing() {
      const developerId = document.getElementById('developerSelect').value;
      const developeeId = document.getElementById('developeeSelect').value;
      const messageDiv = document.getElementById('message');
      const errorDiv = document.getElementById('errorMessage');
      messageDiv.textContent = '';
      errorDiv.textContent = '';

      if (developerId === developeeId) {
        errorDiv.textContent = 'Developer and developee should usually be different people (unless this is test data).';
      }

      try {
        await apiCall('/pairings', { method: 'POST', body: JSON.stringify({ developerId, developeeId }) });
        messageDiv.textContent = 'Pairing created.';
        loadPairings();
      } catch (err) {
        errorDiv.textContent = err.message;
      }
    }

    async function startPlan(pairingId) {
      try {
        const plan = await apiCall('/plans', { method: 'POST', body: JSON.stringify({ pairingId }) });
        window.location.href = '/plan.html?id=' + plan.id;
      } catch (err) {
        alert(err.message);
      }
    }

    loadUsers();
    loadPairings();
  </script>
</body>
</html>
