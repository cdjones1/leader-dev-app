<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Module Content</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #1a1a2e; color: #eee; margin: 0; padding: 32px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    h1 { font-size: 22px; margin: 0; }
    a { color: #93c5fd; text-decoration: none; }
    .card { background: #16213e; padding: 20px; border-radius: 8px; margin-bottom: 16px; }
    .card h2 { margin-top: 0; font-size: 16px; }
    label { display: block; margin-top: 10px; font-size: 13px; color: #aaa; }
    input, textarea {
      width: 100%; padding: 8px; margin-top: 4px; border-radius: 6px;
      border: 1px solid #333; background: #0f172a; color: #eee; box-sizing: border-box;
      font-family: inherit;
    }
    button {
      margin-top: 10px; padding: 7px 14px; background: #4f46e5; color: white;
      border: none; border-radius: 6px; cursor: pointer; font-size: 13px;
    }
    button:hover { background: #4338ca; }
    .task-row { display: flex; justify-content: space-between; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid #2a2a4a; }
    .task-row:last-child { border-bottom: none; }
    .task-row button { background: #7f1d1d; margin: 0; flex-shrink: 0; }
    .task-meta { color: #888; font-size: 12px; margin-top: 2px; }
    .add-task-box { margin-top: 12px; padding: 12px; background: #0f172a; border-radius: 6px; }
    .saved-note { color: #86efac; font-size: 12px; margin-left: 10px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Module Content</h1>
    <a href="/dashboard.html">&larr; Back to Dashboard</a>
  </div>
  <p style="color:#888;">Define the title, description, and checklist for each of the 8 modules. Every new plan copies this content when it's created - editing here won't change plans already in progress.</p>

  <div id="templatesContainer">Loading...</div>

  <script>
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    if (!token) window.location.href = '/index.html';
    if (!user.isAdmin) {
      document.body.innerHTML = '<p>This page is admin-only.</p>';
      throw new Error('not admin');
    }

    async function apiCall(url, options = {}) {
      const res = await fetch(url, {
        ...options,
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token, ...(options.headers || {}) },
      });
      if (res.status === 204) return null;
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    }

    function templateCardHtml(seq, template) {
      const title = template ? template.title : '';
      const description = template ? template.description : '';
      const tasks = template ? template.taskTemplates : [];

      const taskRows = tasks.map((t) => `
        <div class="task-row">
          <div>
            <strong>${t.text}</strong> <span class="task-meta">(${t.taskType}, assigned to ${t.assignedTo ? t.assignedTo.toLowerCase() : 'developee'})</span>
            ${t.content ? `<div class="task-meta">${t.content.slice(0, 80)}${t.content.length > 80 ? '...' : ''}</div>` : ''}
            ${t.taskType === 'QUESTION' ? `<div class="task-meta">Correct answer: ${t.correctAnswer}</div>` : ''}
            ${t.taskType === 'CHECKLIST' ? `<div class="task-meta">${(t.checklistItemTemplates || []).length} checklist item(s)</div>` : ''}
            ${t.taskType === 'MULTIPLE_CHOICE' ? `<div class="task-meta">${(t.choiceOptionTemplates || []).length} option(s)</div>` : ''}
          </div>
          <div style="display:flex; gap:6px;">
            <button style="background:#374151;" onclick='editTask(${seq}, ${JSON.stringify(t).replace(/'/g, "&apos;")})'>Edit</button>
            <button onclick="removeTask('${t.id}', ${seq})">Remove</button>
          </div>
        </div>
      `).join('');

      return `
        <div class="card">
          <h2>Module ${seq}</h2>
          <label>Title</label>
          <input type="text" id="title-${seq}" value="${title.replace(/"/g, '&quot;')}">
          <label>Description</label>
          <textarea id="description-${seq}" rows="2">${description}</textarea>
          <button onclick="saveTemplate(${seq})">Save Title/Description</button>
          <span id="saved-${seq}" class="saved-note" style="display:none;">Saved</span>

          <label style="margin-top:16px;">Tasks</label>
          <div id="tasks-${seq}">${taskRows}</div>

          <div class="add-task-box">
            <div id="formLabel-${seq}" style="color:#93c5fd; font-size:13px; margin-bottom:4px;">New Task</div>
            <label>Task Title</label>
            <input type="text" id="newTaskText-${seq}" placeholder="e.g. Read Chapter 1">
            <label>Assigned To</label>
            <select id="newTaskAssignedTo-${seq}">
              <option value="DEVELOPEE">Developee (the person being developed)</option>
              <option value="DEVELOPER">Developer (the one doing the developing)</option>
            </select>
            <label>Task Type</label>
            <select id="newTaskType-${seq}" onchange="onTypeChange(${seq})">
              <option value="READING">Reading (just read/mark complete)</option>
              <option value="QUESTION">Question (open-ended, locked on submit)</option>
              <option value="CHECKLIST">Checklist (multiple sub-items to check off)</option>
              <option value="MULTIPLE_CHOICE">Multiple Choice (auto-graded)</option>
            </select>
            <label>Content (what they'll read on this task's page)</label>
            <textarea id="newTaskContent-${seq}" rows="3" placeholder="The reading material or the question itself..."></textarea>
            <div id="answerField-${seq}" style="display:none;">
              <label>Correct Answer (revealed to them after they submit their own answer)</label>
              <textarea id="newTaskAnswer-${seq}" rows="2"></textarea>
            </div>
            <div id="checklistField-${seq}" style="display:none;">
              <label>Checklist Items</label>
              <div id="checklistItems-${seq}"></div>
              <button type="button" style="background:#374151;" onclick="addChecklistRow(${seq})">+ Add Item</button>
            </div>
            <div id="choicesField-${seq}" style="display:none;">
              <label>Answer Choices (mark the one correct answer)</label>
              <div id="choiceOptions-${seq}"></div>
              <button type="button" style="background:#374151;" onclick="addChoiceRow(${seq})">+ Add Option</button>
            </div>
            <button id="saveTaskBtn-${seq}" onclick="addTask(${seq})">Add Task</button>
            <button id="cancelEditBtn-${seq}" style="display:none; background:#374151;" onclick="cancelEdit(${seq})">Cancel Edit</button>
          </div>
        </div>
      `;
    }

    let editingTaskId = {};

    function onTypeChange(seq) {
      const type = document.getElementById(`newTaskType-${seq}`).value;
      document.getElementById(`answerField-${seq}`).style.display = type === 'QUESTION' ? 'block' : 'none';
      document.getElementById(`checklistField-${seq}`).style.display = type === 'CHECKLIST' ? 'block' : 'none';
      document.getElementById(`choicesField-${seq}`).style.display = type === 'MULTIPLE_CHOICE' ? 'block' : 'none';
      if (type === 'CHECKLIST' && document.getElementById(`checklistItems-${seq}`).children.length === 0) {
        addChecklistRow(seq); addChecklistRow(seq);
      }
      if (type === 'MULTIPLE_CHOICE' && document.getElementById(`choiceOptions-${seq}`).children.length === 0) {
        addChoiceRow(seq); addChoiceRow(seq);
      }
    }

    function addChecklistRow(seq, value = '') {
      const container = document.getElementById(`checklistItems-${seq}`);
      const row = document.createElement('div');
      row.style.cssText = 'display:flex; gap:6px; margin-top:6px;';
      row.innerHTML = `<input type="text" value="${value.replace(/"/g, '&quot;')}" style="flex:1;" placeholder="Checklist item text">
        <button type="button" style="background:#7f1d1d; margin:0;" onclick="this.parentElement.remove()">✕</button>`;
      container.appendChild(row);
    }

    function addChoiceRow(seq, text = '', isCorrect = false) {
      const container = document.getElementById(`choiceOptions-${seq}`);
      const row = document.createElement('div');
      row.style.cssText = 'display:flex; gap:6px; margin-top:6px; align-items:center;';
      row.innerHTML = `<input type="radio" name="correctChoice-${seq}" ${isCorrect ? 'checked' : ''} style="width:auto;">
        <input type="text" value="${text.replace(/"/g, '&quot;')}" style="flex:1;" placeholder="Option text">
        <button type="button" style="background:#7f1d1d; margin:0;" onclick="this.parentElement.remove()">✕</button>`;
      container.appendChild(row);
    }

    function readChecklistRows(seq) {
      return [...document.getElementById(`checklistItems-${seq}`).children]
        .map((row) => ({ text: row.querySelector('input[type="text"]').value.trim() }))
        .filter((item) => item.text);
    }

    function readChoiceRows(seq) {
      return [...document.getElementById(`choiceOptions-${seq}`).children]
        .map((row) => ({
          text: row.querySelector('input[type="text"]').value.trim(),
          isCorrect: row.querySelector('input[type="radio"]').checked,
        }))
        .filter((opt) => opt.text);
    }

    function editTask(seq, task) {
      editingTaskId[seq] = task.id;
      document.getElementById(`newTaskText-${seq}`).value = task.text;
      document.getElementById(`newTaskType-${seq}`).value = task.taskType;
      document.getElementById(`newTaskAssignedTo-${seq}`).value = task.assignedTo || 'DEVELOPEE';
      document.getElementById(`newTaskContent-${seq}`).value = task.content || '';
      document.getElementById(`newTaskAnswer-${seq}`).value = task.correctAnswer || '';

      document.getElementById(`checklistItems-${seq}`).innerHTML = '';
      document.getElementById(`choiceOptions-${seq}`).innerHTML = '';
      (task.checklistItemTemplates || []).forEach((item) => addChecklistRow(seq, item.text));
      (task.choiceOptionTemplates || []).forEach((opt) => addChoiceRow(seq, opt.text, opt.isCorrect));

      onTypeChange(seq);
      document.getElementById(`formLabel-${seq}`).textContent = 'Editing: ' + task.text;
      document.getElementById(`saveTaskBtn-${seq}`).textContent = 'Update Task';
      document.getElementById(`cancelEditBtn-${seq}`).style.display = 'inline-block';
      document.getElementById(`newTaskText-${seq}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function cancelEdit(seq) {
      editingTaskId[seq] = null;
      document.getElementById(`newTaskText-${seq}`).value = '';
      document.getElementById(`newTaskAssignedTo-${seq}`).value = 'DEVELOPEE';
      document.getElementById(`newTaskContent-${seq}`).value = '';
      document.getElementById(`newTaskAnswer-${seq}`).value = '';
      document.getElementById(`newTaskType-${seq}`).value = 'READING';
      document.getElementById(`checklistItems-${seq}`).innerHTML = '';
      document.getElementById(`choiceOptions-${seq}`).innerHTML = '';
      onTypeChange(seq);
      document.getElementById(`formLabel-${seq}`).textContent = 'New Task';
      document.getElementById(`saveTaskBtn-${seq}`).textContent = 'Add Task';
      document.getElementById(`cancelEditBtn-${seq}`).style.display = 'none';
    }

    let templatesBySeq = {};

    async function loadTemplates() {
      const templates = await apiCall('/module-templates');
      templatesBySeq = {};
      templates.forEach((t) => { templatesBySeq[t.sequenceOrder] = t; });

      const container = document.getElementById('templatesContainer');
      let html = '';
      for (let seq = 1; seq <= 8; seq++) {
        html += templateCardHtml(seq, templatesBySeq[seq] || null);
      }
      container.innerHTML = html;
    }

    async function saveTemplate(seq) {
      const title = document.getElementById(`title-${seq}`).value;
      const description = document.getElementById(`description-${seq}`).value;
      try {
        await apiCall(`/module-templates/${seq}`, { method: 'PUT', body: JSON.stringify({ title, description }) });
        const savedNote = document.getElementById(`saved-${seq}`);
        savedNote.style.display = 'inline';
        setTimeout(() => { savedNote.style.display = 'none'; }, 2000);
        loadTemplates();
      } catch (err) {
        alert(err.message);
      }
    }

    async function addTask(seq) {
      const text = document.getElementById(`newTaskText-${seq}`).value.trim();
      const taskType = document.getElementById(`newTaskType-${seq}`).value;
      const assignedTo = document.getElementById(`newTaskAssignedTo-${seq}`).value;
      const content = document.getElementById(`newTaskContent-${seq}`).value;
      const correctAnswer = document.getElementById(`newTaskAnswer-${seq}`).value;
      const checklistItems = readChecklistRows(seq);
      const choiceOptions = readChoiceRows(seq);

      if (!text) return;
      if (taskType === 'QUESTION' && !correctAnswer.trim()) {
        alert('A question task needs a correct answer.');
        return;
      }
      if (taskType === 'CHECKLIST' && checklistItems.length === 0) {
        alert('Add at least one checklist item.');
        return;
      }
      if (taskType === 'MULTIPLE_CHOICE') {
        if (choiceOptions.length < 2) {
          alert('Add at least 2 answer choices.');
          return;
        }
        if (!choiceOptions.some((o) => o.isCorrect)) {
          alert('Mark one option as the correct answer.');
          return;
        }
      }

      const editingId = editingTaskId[seq];
      const body = { text, content, taskType, correctAnswer, checklistItems, choiceOptions, assignedTo };

      try {
        if (editingId) {
          await apiCall(`/module-templates/tasks/${editingId}`, { method: 'PUT', body: JSON.stringify(body) });
          editingTaskId[seq] = null;
        } else {
          await apiCall(`/module-templates/${seq}/tasks`, { method: 'POST', body: JSON.stringify(body) });
        }
        loadTemplates();
      } catch (err) {
        alert(err.message);
      }
    }

    async function removeTask(taskId, seq) {
      try {
        await apiCall(`/module-templates/tasks/${taskId}`, { method: 'DELETE' });
        loadTemplates();
      } catch (err) {
        alert(err.message);
      }
    }

    loadTemplates();
  </script>
</body>
</html>
