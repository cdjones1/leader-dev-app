<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change Password</title>
  <style>
    :root { --accent:#d6222a; --accent-dark:#b71c23; --bg:#f7f5f2; --card:#fff; --border:#e7e3dd; --text:#1a1a1a; --text-muted:#6b6560; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, "Helvetica Neue", sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 32px; }
    .card { max-width: 420px; margin: 40px auto; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 28px; }
    h1 { font-size: 24px; margin: 0 0 6px; }
    p.sub { color: var(--text-muted); margin: 0 0 20px; font-size: 14px; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
    input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; }
    button { margin-top: 20px; width: 100%; padding: 11px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-weight: 600; font-size: 15px; cursor: pointer; }
    button:hover { background: var(--accent-dark); }
    button:disabled { opacity: .6; cursor: default; }
    #msg { margin-top: 16px; font-size: 14px; }
    .err { color: #b71c23; } .ok { color: #1a7a3a; }
    a.back { display: block; text-align: center; margin-top: 18px; color: var(--accent); text-decoration: none; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Change Password</h1>
    <p class="sub">Enter your current password, then choose a new one (at least 6 characters).</p>
    <form id="form">
      <label for="cur">Current password</label>
      <input id="cur" type="password" autocomplete="current-password" required>
      <label for="new1">New password</label>
      <input id="new1" type="password" autocomplete="new-password" minlength="6" required>
      <label for="new2">Confirm new password</label>
      <input id="new2" type="password" autocomplete="new-password" minlength="6" required>
      <button id="btn" type="submit">Change Password</button>
    </form>
    <div id="msg"></div>
    <a class="back" href="/myplans.html">&larr; Back to My Plans</a>
  </div>
  <script>
    const token = localStorage.getItem('token');
    if (!token) window.location.href = '/index.html';
    const msg = document.getElementById('msg');
    function show(text, ok) { msg.textContent = text; msg.className = ok ? 'ok' : 'err'; }

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const cur = document.getElementById('cur').value;
      const n1 = document.getElementById('new1').value;
      const n2 = document.getElementById('new2').value;
      if (n1 !== n2) return show('The new passwords do not match.', false);
      if (n1.length < 6) return show('New password must be at least 6 characters.', false);
      const btn = document.getElementById('btn');
      btn.disabled = true; show('Saving...', true);
      try {
        const res = await fetch('/auth/change-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
          body: JSON.stringify({ currentPassword: cur, newPassword: n1 })
        });
        const data = await res.json().catch(() => ({}));
        if (res.status === 401) { window.location.href = '/index.html'; return; }
        if (!res.ok) { show(data.error || 'Could not change password.', false); }
        else { show('Password changed. Use your new password next time you log in.', true); e.target.reset(); }
      } catch (err) { show('Network error - please try again.', false); }
      btn.disabled = false;
    });
  </script>
</body>
</html>
